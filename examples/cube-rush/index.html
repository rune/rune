  </head>
  <body>
    <div class="screen pausedScreen" id="pausedScreen">
      <img src="/src/logo.svg" class="logo" />
      <button class="startBtn" type="button"></button>
    </div>

    <div class="screen countdownScreen" id="countdownScreen">
      <div class="countdown"></div>
    </div>

    <div class="screen playingScreen" id="playingScreen">
      <div class="info" id="info">
        <div class="side">
          <div class="infoValue">
            <p class="placeLabel"></p>
            <div class="place">-</div>
          </div>
          <div class="infoValue">
            <p class="speedLabel"></p>
            <div class="speed">-</div>
          </div>
        </div>
        <div class="middle">
          <div class="trackProgress">
            <div class="trackProgressTrack"></div>
          </div>
          <div class="spectating">
            <span class="spectatingPrefix"></span>
            <span class="displayName">-</span>
            <img class="avatar" />
          </div>
        </div>
        <div class="side"></div>
      </div>
      <div class="stats" id="stats" style="visibility: hidden">
        <div class="content">
          <div class="infoValue">
            <p class="youPlacedLabel"></p>
            <div class="place">-</div>
          </div>
          <div class="infoValue">
            <p class="topSpeedLabel"></p>
            <div class="topSpeed">-</div>
          </div>
          <div class="infoValue">
            <p class="timeLabel"></p>
            <div class="elapse">-</div>
          </div>
          <div class="infoValue bestTimeContainer" style="display: none">
            <p class="bestTimeLabel"></p>
            <div class="bestTime">-</div>
          </div>
        </div>
      </div>
      <div class="controlsPreview">
        <div class="left"></div>
        <div class="right"></div>
      </div>
    </div>

    <script type="module" src="/src/logic.ts"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
