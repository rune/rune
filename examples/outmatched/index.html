<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1"
    />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <script id="rune-translation-data" type="application/json">
      {
        "en": {
          "1 Move Left": "1 Move Left",
          "{{movesLeft}} Moves Left": "{{movesLeft}} Moves Left",
          "Extra Move!": "Extra Move!",
          "Out of Moves!": "Out of Moves!",
          "Your Turn!": "Your Turn!",
          "Last Round!": "Last Round!",
          "Shuffle!": "Shuffle!",
          "Match me with the same color!": "Match me with the same color!",
          "You": "You"
        },
        "es": {
          "1 Move Left": "1 Movimiento Restante",
          "{{movesLeft}} Moves Left": "{{movesLeft}} Movimientos Restantes",
          "Extra Move!": "¡Movimiento Extra!",
          "Out of Moves!": "¡Sin Movimientos!",
          "Your Turn!": "¡Tu Turno!",
          "Last Round!": "¡Última Ronda!",
          "Shuffle!": "¡Mezclar!",
          "Match me with the same color!": "¡Combíname con el mismo color!",
          "You": "Tú"
        },
        "pt": {
          "1 Move Left": "1 Jogada Restante",
          "{{movesLeft}} Moves Left": "{{movesLeft}} Jogadas Restantes",
          "Extra Move!": "Jogada Extra!",
          "Out of Moves!": "Sem Jogadas!",
          "Your Turn!": "Sua Vez!",
          "Last Round!": "Última Rodada!",
          "Shuffle!": "Embaralhar!",
          "Match me with the same color!": "Combine-me com a mesma cor!",
          "You": "Você"
        },
        "ru": {
          "1 Move Left": "Остался 1 Ход",
          "{{movesLeft}} Moves Left": "Осталось Ходов: {{movesLeft}}",
          "Extra Move!": "Дополнительный Ход!",
          "Out of Moves!": "Ходы Закончились!",
          "Your Turn!": "Ваш Ход!",
          "Last Round!": "Последний Раунд!",
          "Shuffle!": "Перемешать!",
          "Match me with the same color!": "Соедини меня с тем же цветом!",
          "You": "Вы"
        }
      }
    </script>
  </head>
  <body class="loading">
    <main>
      <header>
        <nav>
          <ol id="rounds"></ol>
        </nav>
        <ul id="players"></ul>
        <ol id="moves"></ol>
      </header>
      <div id="board-outer">
        <div id="board-inner">
          <div id="board">
            <div id="frames"></div>
            <div id="tiles"></div>
            <div id="move-hint"></div>
          </div>
        </div>
      </div>
      <footer>
        <nav>
          <button id="shuffle-button" type="button">
            <img src="images/shuffle.svg" alt="Shuffle" />
            <ol id="shuffles"></ol>
          </button>
          <button id="extra-move-button" type="button">
            <img src="images/extra-move.svg" alt="Extra move" />
            <ol id="extra-moves"></ol>
          </button>
        </nav>
      </footer>
    </main>
    <script type="module" src="/src/logic/logic.ts"></script>
    <script type="module" src="/src/client.ts"></script>
  </body>
</html>
