"""
Indicates exactly one field must be supplied and this field must not be `null`.
"""
directive @oneOf on INPUT_OBJECT

input CheckVerificationInput {
  clientMutationId: String
  verificationToken: String!
}

type CheckVerificationPayload {
  authToken: String
  clientMutationId: String
}

input CreateGameInput {
  clientMutationId: String
  description: String
  logo: Upload
  previewImg: Upload
  title: String!
  type: GameType!
}

type CreateGamePayload {
  clientMutationId: String
  game: Game!
}

input CreateGameVersionInput {
  clientMutationId: String
  content: Upload!
  gameId: Int!
  isDraft: Boolean
  postToDiscord: Boolean
}

type CreateGameVersionPayload {
  clientMutationId: String
  congratulationMsg: String
  gameVersion: GameVersion!
  previewLink: String!
}

type Game {
  createdAt: String!
  description: String
  gameDevs: GameDevsConnection!
  gameVersions(orderBy: [GameVersionsOrderBy!]): GameVersionsConnection!
  id: Int!

  """Identifies the game in rune.ai URLs, such as its stats page."""
  key: String!
  logoUrl: String!
  previewImgUrl: String
  title: String!
  type: GameType!
}

type GameDev {
  displayName: String
  type: GameDevType!
  userId: Int!
}

enum GameDevType {
  ADMIN
  DEV
  TESTER
}

type GameDevsConnection {
  nodes: [GameDev!]!
}

enum GameType {
  EXTERNAL
  MULTIPLAYER
}

type GameVersion {
  gameId: Int!
  gameVersionId: Int!
  status: GameVersionStatus!
}

enum GameVersionStatus {
  ACTIVE
  DRAFT
  INACTIVE
  IN_REVIEW
  UPLOADING
}

type GameVersionsConnection {
  nodes: [GameVersion!]!
}

enum GameVersionsOrderBy {
  PRIMARY_KEY_ASC
  PRIMARY_KEY_DESC
}

type GamesConnection {
  nodes: [Game!]!
}

type Me {
  admin: Boolean!
  devId: Int!
  displayName: String!
  email: String
}

type Mutation {
  """
  Step 2 of the CLI's magic-link login. The CLI polls this every 2s; authToken stays null until the emailed link is confirmed.
  """
  checkVerification(input: CheckVerificationInput!): CheckVerificationPayload!

  """
  Create a game and make the caller its ADMIN. Media is generated when no preview image is supplied.
  """
  createGame(input: CreateGameInput!): CreateGamePayload!
  createGameVersion(input: CreateGameVersionInput!): CreateGameVersionPayload!

  """
  Step 1 of the CLI's magic-link login. Emails a confirmation link and returns a token for polling checkVerification. Anonymous, and the response is identical whether or not the email has an account.
  """
  startVerification(input: StartVerificationInput!): StartVerificationPayload!

  """
  Update a game's title, description or media. Blank fields are left unchanged rather than cleared.
  """
  updateGame(input: UpdateGameInput!): UpdateGamePayload!
}

type Query {
  """
  A single game, or null when the requester is not an ACTIVE member of it.
  """
  gameById(id: Int!): Game

  """
  Games the requester is an ACTIVE member of. Tango returned every game and left the filtering to the CLI.
  """
  games: GamesConnection!

  """
  The authenticated dev. The CLI's LoginGate runs this on every start, so it doubles as the token-validity probe that clears a stale token.
  """
  me: Me!
}

input StartVerificationInput {
  clientMutationId: String
  email: String!
}

type StartVerificationPayload {
  clientMutationId: String
  verificationToken: String!
}

input UpdateGameInput {
  clientMutationId: String
  description: String
  gameId: Int!
  logo: Upload
  previewImg: Upload
  title: String
}

type UpdateGamePayload {
  clientMutationId: String
  game: Game!
}

"""The `Upload` scalar type represents a file upload."""
scalar Upload
